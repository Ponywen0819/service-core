# 新服務的起點：複製整個資料夾成 services/<name>/，把下面所有 CHANGEME 換成 <name>。步驟見 README.md「新增一個服務」。
# 服務名稱一律用 <name>- 前綴：gateway-nginx 同時在每個服務的網路上，app、db 這種名字會撞。
services:
  CHANGEME-app:
    extends: {file: ../../common/base.yml, service: hardened}
    image: CHANGEME/image:tag
    # 映像只需要寫 /tmp 就開 read_only；要寫別的地方就加進 tmpfs 或 volume，真的不行再拿掉 read_only
    read_only: true
    tmpfs: [/tmp]
    # 不 publish：gateway-nginx 經 gw-CHANGEME 直接連容器 port（gateway/nginx/conf.d/CHANGEME.conf 的 upstream）
    expose: ["8080"]
    networks: [default, gw-CHANGEME]
    # env_file: [.env]   # Dokploy 的 Environment 不會自動進容器：要全部帶進去就打開這行，或在 environment 用 ${VAR}

  # CHANGEME-db:
  #   extends: {file: ../../common/postgres.yml, service: postgres}
  #   environment:
  #     POSTGRES_PASSWORD: ${PG_PASSWORD:?請設定 PG_PASSWORD}
  #     POSTGRES_DB: CHANGEME
  #   volumes: [db-data:/var/lib/postgresql]
  #   networks: [default]    # 不要加 gw-CHANGEME：gateway 不需要碰 DB

# volumes:
#   db-data:

networks:
  # gateway/docker-compose.yml 建立的
  gw-CHANGEME:
    external: true
