# 來源：newsletter-ops/docker-compose.yml。nginx 與 cloudflared 不在這裡：入口與轉接是 gateway/ 的事
# （newsletter 的閘門規則在 gateway/nginx/conf.d/newsletter.conf）。不 build，只拉 ghcr 映像。
# Dokploy：Compose app，Compose Path ./services/newsletter/docker-compose.yml；不要加 Domain、不要開 Isolated Deployment。
# 要先部署 gateway（它建立 gw-newsletter 網路）。Environment 填 GMAIL_USER 等（見 .env.example）。
# 服務名稱加 newsletter- 前綴：gateway-nginx 同時在每個服務的網路上，web、worker 這種名字會撞。

services:
  newsletter-web:
    extends: {file: ../../common/base.yml, service: hardened}
    image: ghcr.io/ponywen0819/newsletter-ops-web:${NEWSLETTER_TAG:-latest}
    # 不做身分驗證，只能經 gateway-nginx 連：不 publish，只在 gw-newsletter（gateway）與 be（worker）
    command: ["newsletter-web", "--host", "0.0.0.0", "--port", "8787"]
    read_only: true
    tmpfs: [/tmp, "/home/app:mode=1777"]
    volumes: [newsletter-data:/var/lib/newsletter]
    # gw-newsletter 不是 internal：web 驗 token 時要呼叫 Claude
    networks: [gw-newsletter, be]
    environment:
      NEWSLETTER_WORKER_URL: http://newsletter-worker:8790
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8787/reports', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3

  newsletter-worker:
    extends: {file: ../../common/base.yml, service: hardened}
    image: ghcr.io/ponywen0819/newsletter-ops-worker:${NEWSLETTER_TAG:-latest}
    read_only: true
    tmpfs: [/tmp, "/home/app:mode=1777"]
    volumes: [newsletter-data:/var/lib/newsletter]
    # /status、/run、/job 只在 be 網路：/run 會用額度、寄信，gateway 碰不到
    networks: [be]
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8790/status', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      GMAIL_USER: ${GMAIL_USER:?請設定 GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:?請設定 GMAIL_APP_PASSWORD}
      NEWSLETTER_MAIL_TO: ${NEWSLETTER_MAIL_TO:-${GMAIL_USER}}
      NEWSLETTER_RUN_AT: ${NEWSLETTER_RUN_AT:-08:00}
      NEWSLETTER_AUTH_CHECK_AT: ${NEWSLETTER_AUTH_CHECK_AT:-07:30}
      NEWSLETTER_BASE_URL: ${NEWSLETTER_BASE_URL:-https://newsletter.ponygames.net}
      NEWSLETTER_HEARTBEAT_URL: ${NEWSLETTER_HEARTBEAT_URL:-}

volumes:
  newsletter-data:

networks:
  # web ↔ worker
  be:
  # gateway/docker-compose.yml 建立的；gateway-nginx 從這裡連 newsletter-web
  gw-newsletter:
    external: true
