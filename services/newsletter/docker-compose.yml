# 來源：newsletter-ops/docker-compose.yml，搬來 service-core 後的差別：
#   - 拿掉 cloudflared（統一由 ingress/ 的那個負責）、不 build（只拉 ghcr 映像）
#   - newsletter-nginx 加進 dokploy-network 並帶 Traefik labels：newsletter.ponygames.net → newsletter-nginx:8080
#   - 服務名稱一律加 newsletter- 前綴：別的 compose 也會有 web、nginx，同在 dokploy-network 上會被 DNS 解到別人的容器
# Dokploy：Compose app，Compose Path 填 ./services/newsletter/docker-compose.yml；不要開 Isolated Deployment、
# 不要在 UI 加 Domain（路由寫在下面的 labels）。Environment 填 GMAIL_USER 等（見 .env.example）。

services:
  newsletter-web:
    extends: {file: ../../common/base.yml, service: hardened}
    image: ghcr.io/ponywen0819/newsletter-ops-web:${NEWSLETTER_TAG:-latest}
    # 不做身分驗證，只能經 nginx 連：不 publish、不在 dokploy-network（Traefik、cloudflared 碰不到）
    command: ["newsletter-web", "--host", "0.0.0.0", "--port", "8787"]
    read_only: true
    tmpfs: [/tmp, "/home/app:mode=1777"]
    volumes: [newsletter-data:/var/lib/newsletter]
    networks: [app, be]
    environment:
      NEWSLETTER_WORKER_URL: http://newsletter-worker:8790
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8787/reports', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3

  newsletter-worker:
    extends: {file: ../../common/base.yml, service: hardened}
    image: ghcr.io/ponywen0819/newsletter-ops-worker:${NEWSLETTER_TAG:-latest}
    read_only: true
    tmpfs: [/tmp, "/home/app:mode=1777"]
    volumes: [newsletter-data:/var/lib/newsletter]
    # /status、/run、/job 只在 be 網路：/run 會用額度、寄信
    networks: [be]
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8790/status', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      GMAIL_USER: ${GMAIL_USER:?請設定 GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:?請設定 GMAIL_APP_PASSWORD}
      NEWSLETTER_MAIL_TO: ${NEWSLETTER_MAIL_TO:-${GMAIL_USER}}
      NEWSLETTER_RUN_AT: ${NEWSLETTER_RUN_AT:-08:00}
      NEWSLETTER_AUTH_CHECK_AT: ${NEWSLETTER_AUTH_CHECK_AT:-07:30}
      NEWSLETTER_BASE_URL: ${NEWSLETTER_BASE_URL:-https://newsletter.ponygames.net}
      NEWSLETTER_HEARTBEAT_URL: ${NEWSLETTER_HEARTBEAT_URL:-}

  newsletter-nginx:
    # 閘門：8080 給 Traefik（/auth、/ops 一律 404），8788 給家裡區網／VPN（含 /auth、/ops）。規則在 nginx.conf
    image: nginxinc/nginx-unprivileged:1.30.6-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # 只綁 IPv4：IPv6 經 docker-proxy 轉進來時來源會變成 bridge 閘道（私有位址），繞過來源檢查
    ports:
      - "0.0.0.0:8788:8788"
    networks: [dokploy-network, app]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    labels:
      - traefik.enable=true
      # router／service 名稱在整台 Traefik 是全域的：一律用資料夾名稱當前綴
      - traefik.http.routers.newsletter.rule=Host(`newsletter.ponygames.net`)
      - traefik.http.routers.newsletter.entrypoints=web
      - traefik.http.routers.newsletter.service=newsletter
      - traefik.http.services.newsletter.loadbalancer.server.port=8080
      # nginx 在兩個網路上，要告訴 Traefik 走哪個
      - traefik.docker.network=dokploy-network
    depends_on:
      newsletter-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  newsletter-data:

networks:
  # worker 與 web：nginx、Traefik、cloudflared 都不該連得到 worker
  be:
  # nginx ↔ web；web 需要對外（驗 token 時呼叫 Claude），所以不設 internal
  app:
  # Dokploy 的共用網路，Traefik 在上面；只讓 nginx 加入
  dokploy-network:
    external: true
