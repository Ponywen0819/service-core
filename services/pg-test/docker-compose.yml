services:
  pg-test:
    extends: {file: ../../common/postgres.yml, service: postgres}
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD:?請設定 PG_PASSWORD}
      POSTGRES_DB: personal
    volumes:
      - pg:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro
      - /backups/pg:/backups:ro   
    command: >
      -c shared_buffers=256MB -c max_connections=100
    # 給不在 dokploy-network 裡的 CI job（runner 用 docker.sock 開的兄弟容器）用。
    # 這會綁 host 所有介面：區網其他機器也連得到，只想給本機就改成 "127.0.0.1:5432:5432"
    ports:
      - "5432:5432"
    # 和 github-runner 共用：runner 容器裡的步驟用 pg-test:5432 連
    networks: [dokploy-network]

volumes:
  pg:

networks:
  dokploy-network:
    external: true
