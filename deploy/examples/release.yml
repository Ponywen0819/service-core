# 範本：複製到專案 repo 的 .github/workflows/release.yml，換掉 CHANGEME。
# 在 main 打 v* tag 時建映像推到 GHCR（版本號、latest、sha 三個標籤指向同一個映像），推完呼叫 service-core 的共用部署。
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/CHANGEME-owner/CHANGEME-app   # GHCR 只能小寫

jobs:
  image:
    runs-on: [self-hosted, linux, x64, docker]
    steps:
      - uses: actions/checkout@v4
      # host 是 arm64（raspi）而 runner 是 x64 時要 QEMU；同架構就拿掉這步和 platforms
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 映像推完才部署
  deploy:
    needs: image
    uses: Ponywen0819/service-core/.github/workflows/deploy.yml@main
    with:
      tag: ${{ github.ref_name }}
      host: ${{ vars.DEPLOY_HOST }}
    secrets:
      ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
