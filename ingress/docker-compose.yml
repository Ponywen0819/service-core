# 統一入口：一個 cloudflared，全部的 *.ponygames.net 都經它進到 Dokploy 的 Traefik，再由 Traefik 依 Host 分到各服務。
# Dokploy：Compose app，Compose Path 填 ./ingress/docker-compose.yml，Environment 填 TUNNEL_TOKEN。不要幫它加 Domain。
# 路由（哪個 hostname 進 Tunnel、要不要驗 Access JWT）在 cloudflare-tunnel.json，用 tunnel-sync.sh 套用，不要在 Cloudflare 網頁上改。
services:
  ingress-cloudflared:
    extends: {file: ../common/base.yml, service: hardened}
    # 固定版本：上游改行為（例如 QUIC）會讓 tunnel 斷線；要升級時改這裡
    image: cloudflare/cloudflared:2026.10.7
    # QUIC 在家用網路上會定期斷線，改用 http2
    command: tunnel --no-autoupdate --protocol http2 run
    read_only: true
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?請設定 TUNNEL_TOKEN（Cloudflare Zero Trust 建立 Tunnel 時取得）}
    # 只在 dokploy-network：連得到 dokploy-traefik，各服務只有掛了 Traefik 的那個容器在這個網路
    networks: [dokploy-network]

networks:
  dokploy-network:
    external: true
