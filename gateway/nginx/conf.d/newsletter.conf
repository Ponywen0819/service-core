# newsletter：web 不做身分驗證，誰能開 /auth 與 /ops 由這裡決定。來源：newsletter-ops/docker/nginx.conf。
#   8080 + Host newsletter.ponygames.net：經 cloudflared 進來，身分由 Cloudflare Access 驗過（Tunnel 也驗 Access JWT）。
#        /auth、/ops（授權、手動執行、維運資訊）與它們的 API 一律 404。
#   8788：家裡區網／VPN 直接連（gateway compose publish 到 host）。只放行 $lan 的來源，
#        Host 必須是 IP 或 localhost（擋 DNS rebinding），/auth 與 /ops 在這裡。$lan 等定義在 00-common.conf。
# 服務本身在 newsletter-ops repo，不在這裡。它的 web 要加入 gw-newsletter 網路並帶別名 newsletter-web（見 README「接上 gateway」）。

server {
    listen 8080;
    server_name newsletter.ponygames.net;
    set $newsletter http://newsletter-web:8787;

    # 頁面交給前端顯示「找不到」；API 直接 404
    location ~ ^/(auth|ops)(/|$) {
        rewrite ^ /not-found break;
        proxy_pass $newsletter;
    }
    location ~ ^/api/(auth|ops)(/|$) {
        default_type application/json;
        return 404 '{"error": "not found"}';
    }
    location = /api/session {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 200 '{"local": false}';
    }
    location / {
        proxy_pass $newsletter;
    }
}

server {
    listen 8788;
    set $newsletter http://newsletter-web:8787;

    if ($lan = 0) {
        return 403;
    }
    if ($lan_host = 0) {
        return 421;
    }
    if ($lan_origin = 0) {
        return 403;
    }

    location / {
        proxy_pass $newsletter;
        proxy_read_timeout 150s;  # 貼 token 時會等 Claude 驗證（最多 90 秒）
    }
}
