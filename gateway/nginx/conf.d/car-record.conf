# car-record：身分由 Cloudflare Access 驗過（*.ponygames.net 的萬用規則與 Access app）。
# 服務本身在 car-record repo，不在這裡。它的容器要加入 gw-car-record 網路並帶別名 car-record（見 README「接上 gateway」）。
server {
    listen 8080;
    server_name car-record.ponygames.net;
    set $car_record http://car-record:8080;

    # 照片與同步（/api/push）上限都是 10 MB（apps/server/src/app.ts），留一點 multipart／JSON 的餘裕
    client_max_body_size 12m;

    location / {
        proxy_pass $car_record;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;   # TLS 在 Cloudflare 結束
    }
}
