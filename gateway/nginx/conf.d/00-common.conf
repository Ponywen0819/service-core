# 所有站台共用：http 層級的設定、區網判斷、預設站台。各服務的站台在同目錄的 <name>.conf。
# 整個 conf.d 目錄掛到 /etc/nginx/conf.d（nginx-unprivileged：非 root、pid 與暫存檔在 /tmp），檔名照字母順序載入。

server_tokens off;

# ---- 區網判斷：給「只能從家裡區網／VPN 開」的站台用（例如 newsletter 的 8788） ----

# 可以算區網的來源。VPN 的位址不在這些網段時加一行，例如 Tailscale：100.64.0.0/10 1;
geo $lan {
    default         0;
    127.0.0.0/8     1;
    10.0.0.0/8      1;
    172.16.0.0/12   1;
    192.168.0.0/16  1;
    ::1             1;
    fc00::/7        1;

    # gateway 的 docker 網路（docker-compose.yml 裡固定在 172.31.0.0/16）：別的服務的容器也在這些網路上，
    # 不能讓它們冒充區網來開 /auth、/ops。geo 取最精確的網段，所以這條會蓋過上面的 172.16.0.0/12。
    172.31.0.0/16   0;
    # 但各網路的 bridge 閘道（.1）是 host 本機經 docker-proxy 進來（例如 ssh -L 到 127.0.0.1:8788），要放行。
    # 新增一個 gw-<name> 網路就在這裡加它的 .1
    172.31.0.1      1;
    172.31.1.1      1;
}

# 只認 IP 與 localhost：網域名稱可能被 DNS rebinding 指到區網。要用 raspi.lan 這種名字就加一行
map $host $lan_host {
    default 0;
    ~^(localhost|127\.\d+\.\d+\.\d+|10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+)$ 1;
    ~^\[(::1|f[cd][0-9a-f:]*)\]$ 1;
}

# 跨站請求：有 Origin 就要是同一類位址
map $http_origin $lan_origin {
    ""      1;
    default 0;
    ~^https?://(localhost|127\.\d+\.\d+\.\d+|10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+|\[(::1|f[cd][0-9a-f:]*)\])(:\d+)?$ 1;
}

# ---- 預設站台：Host 對不到任何 server_name 的都到這裡 ----
server {
    listen 8080 default_server;
    server_name _;

    # compose 的 healthcheck 用
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location / {
        return 404;
    }
}
